
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f7">
<title>My AI Voice Studio</title>

<style>
:root {
    --ink: #20212a;
    --muted: #777b89;
    --blue: #3978f6;
    --glass: rgba(255,255,255,.68);
}
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 35px 16px;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(ellipse at 12% 12%, rgba(179,211,255,.8), transparent 34%),
      radial-gradient(ellipse at 88% 18%, rgba(225,204,255,.75), transparent 32%),
      radial-gradient(ellipse at 50% 100%, rgba(191,232,255,.8), transparent 42%),
      linear-gradient(135deg,#f6f8ff,#eef2fb 48%,#f8f5ff);
    background-attachment: fixed;
}

.page { width:100%; max-width:760px; margin:auto; }

.header {
    text-align:center;
    padding:22px 10px 28px;
    animation: rise .7s ease both;
}

.brand-icon {
    width:66px;
    height:66px;
    margin:0 auto 17px;
    display:grid;
    place-items:center;
    border:1px solid white;
    border-radius:23px;
    background:linear-gradient(145deg,#fff,#dceaff);
    color:#3978f6;
    font-size:32px;
    box-shadow:0 16px 38px rgba(93,119,177,.16);
}

h1 {
    margin:0;
    font-size:clamp(30px,5vw,43px);
    letter-spacing:-1.5px;
    font-weight:750;
}

.subtitle {
    margin:11px 0 0;
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
}

.panel {
    padding:30px;
    border:1px solid rgba(255,255,255,.9);
    border-radius:30px;
    background:var(--glass);
    backdrop-filter:blur(26px) saturate(160%);
    -webkit-backdrop-filter:blur(26px) saturate(160%);
    box-shadow:0 24px 70px rgba(77,94,139,.13),
               inset 1px 1px 0 rgba(255,255,255,.95);
    animation:rise .8s .08s ease both;
}

.field { margin-bottom:22px; }

label {
    display:block;
    margin-bottom:10px;
    font-size:14px;
    font-weight:680;
}

select, textarea {
    display:block;
    width:100%;
    border:1px solid rgba(210,218,235,.9);
    border-radius:17px;
    background:rgba(255,255,255,.78);
    color:var(--ink);
    padding:15px 16px;
    font:inherit;
    font-size:15px;
    outline:none;
    transition:.2s ease;
}

select:focus, textarea:focus {
    border-color:rgba(57,120,246,.65);
    box-shadow:0 0 0 4px rgba(57,120,246,.12);
}

.gender-switch {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:6px;
    border:1px solid rgba(210,218,235,.72);
    border-radius:19px;
    background:rgba(225,232,246,.55);
}

.gender-option {
    min-height:58px;
    padding:11px;
    border:1px solid transparent;
    border-radius:14px;
    color:#626a7a;
    background:transparent;
    font:inherit;
    font-size:15px;
    font-weight:650;
    cursor:pointer;
    transition:.22s ease;
}

.gender-option:hover {
    transform:translateY(-1px);
}

.gender-option[aria-pressed="true"] {
    color:#245fe0;
    border-color:white;
    background:linear-gradient(145deg,#fff,#eff5ff);
    box-shadow:0 5px 14px rgba(75,99,150,.12);
}

textarea {
    min-height:300px;
    resize:vertical;
    line-height:1.75;
}

textarea::placeholder { color:#a1a6b3; }

.counter-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
}

#wordCount { font-weight:700; color:#3978f6; }
#wordCount.over { color:#dc3545; }

.hint {
    margin:9px 2px 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
}

#generateBtn {
    width:100%;
    border:1px solid rgba(255,255,255,.5);
    border-radius:17px;
    padding:16px 20px;
    color:white;
    background:linear-gradient(135deg,#5b91ff,#3978f6 48%,#2863e7);
    box-shadow:0 10px 24px rgba(48,105,226,.25);
    font:inherit;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease;
}

#generateBtn:hover {
    transform:translateY(-2px);
    box-shadow:0 14px 30px rgba(48,105,226,.3);
}

#generateBtn:active { transform:scale(.985); }

#generateBtn:disabled {
    opacity:.7;
    cursor:wait;
    transform:none;
}

#status {
    min-height:25px;
    margin-top:16px;
    color:var(--muted);
    text-align:center;
    line-height:1.6;
    overflow-wrap:anywhere;
    font-size:14px;
}

audio {
    display:none;
    width:100%;
    margin-top:20px;
}

.download {
    display:none;
    margin-top:14px;
    padding:15px;
    border:1px solid rgba(57,120,246,.18);
    border-radius:16px;
    background:rgba(231,240,255,.85);
    color:#2863d9;
    text-align:center;
    text-decoration:none;
    font-weight:700;
}

.download:hover { background:#e0ecff; }

.footer {
    padding:22px 8px 4px;
    color:var(--muted);
    text-align:center;
    font-size:12px;
}

@keyframes rise {
    from { opacity:0; transform:translateY(14px); }
    to { opacity:1; transform:translateY(0); }
}

@media(max-width:520px) {
    body { padding:16px 11px; }
    .panel { padding:22px 17px; border-radius:25px; }
    textarea { min-height:240px; }
}
</style>
</head>

<body>
<main class="page">

<header class="header">
    <div class="brand-icon">♫</div>
    <h1>My AI Voice Studio</h1>
    <p class="subtitle">
        अपनी स्क्रिप्ट को प्राकृतिक AI आवाज़ में बदलें।
    </p>
</header>

<section class="panel">

    <div class="field">
        <label>आवाज़ चुनें</label>

        <div class="gender-switch" role="group" aria-label="आवाज़ चुनें">
            <button class="gender-option"
                    type="button"
                    data-gender="female"
                    aria-pressed="true">
                ♀ Female
            </button>

            <button class="gender-option"
                    type="button"
                    data-gender="male"
                    aria-pressed="false">
                ♂ Male
            </button>
        </div>
    </div>

    <div class="field">
        <label for="language">भाषा चुनें</label>
        <select id="language">
            <option value="hi" selected>हिंदी</option>
            <option value="en">English (India)</option>
        </select>
    </div>

    <div class="field">
        <label for="style">बोलने का अंदाज़ चुनें</label>
        <select id="style">
            <option value="story">Storytelling — कहानी सुनाने का अंदाज़</option>
            <option value="documentary">Documentary — गंभीर और जानकारीपूर्ण</option>
            <option value="explainer">Explainer — सरल और दोस्ताना</option>
        </select>
    </div>

    <div class="field">
        <label for="script">अपनी स्क्रिप्ट यहाँ पेस्ट करें</label>

        <textarea
            id="script"
            maxlength="200000"
            placeholder="अपनी पूरी स्क्रिप्ट यहाँ पेस्ट करें..."
        ></textarea>

        <div class="counter-row">
            <span id="wordCount">0 / 10,000 शब्द</span>
            <span id="charCount">0 characters</span>
        </div>

        <p class="hint">
            अधिकतम 10,000 शब्द। लंबी स्क्रिप्ट का Voiceover बनने में काफी समय लग सकता है।
            प्रक्रिया पूरी होने तक पेज खुला रखें।
        </p>
    </div>

    <button id="generateBtn" type="button">
        Generate Voice
    </button>

    <div id="status" role="status" aria-live="polite"></div>

    <audio id="audioPlayer" controls preload="none"></audio>

    <a id="downloadLink"
       class="download"
       download="voiceover.mp3">
       ↓ Download MP3
    </a>

</section>

<footer class="footer">
    My AI Voice Studio
</footer>

</main>

<script>
const MAX_WORDS = 10000;

let selectedGender = "female";
let currentAudioUrl = null;

const scriptInput = document.getElementById("script");
const wordCount = document.getElementById("wordCount");
const charCount = document.getElementById("charCount");
const generateBtn = document.getElementById("generateBtn");
const statusBox = document.getElementById("status");
const audioPlayer = document.getElementById("audioPlayer");
const downloadLink = document.getElementById("downloadLink");

function countWords(text) {
    const cleaned = text.trim();
    return cleaned ? cleaned.split(/\s+/u).length : 0;
}

function updateCounter() {
    const words = countWords(scriptInput.value);
    const characters = scriptInput.value.length;

    wordCount.textContent =
        words.toLocaleString("en-IN") +
        " / 10,000 शब्द";

    charCount.textContent =
        characters.toLocaleString("en-IN") +
        " characters";

    wordCount.classList.toggle("over", words > MAX_WORDS);
    generateBtn.disabled = words > MAX_WORDS;
}

scriptInput.addEventListener("input", updateCounter);

document.querySelectorAll(".gender-option").forEach((option) => {
    option.addEventListener("click", () => {
        selectedGender = option.dataset.gender;

        document.querySelectorAll(".gender-option").forEach((button) => {
            button.setAttribute(
                "aria-pressed",
                String(button.dataset.gender === selectedGender)
            );
        });
    });
});

async function generateVoice() {
    const script = scriptInput.value.trim();
    const words = countWords(script);

    if (!script) {
        statusBox.textContent = "पहले अपनी स्क्रिप्ट पेस्ट करें।";
        return;
    }

    if (words > MAX_WORDS) {
        statusBox.textContent =
            "आपकी स्क्रिप्ट 10,000 शब्दों से ज्यादा है।";
        return;
    }

    const language = document.getElementById("language").value;
    const style = document.getElementById("style").value;

    generateBtn.disabled = true;
    generateBtn.textContent = "आवाज़ तैयार हो रही है...";

    statusBox.textContent =
        "आपकी स्क्रिप्ट प्रोसेस हो रही है। कृपया प्रतीक्षा करें।";

    audioPlayer.pause();
    audioPlayer.removeAttribute("src");
    audioPlayer.style.display = "none";
    downloadLink.style.display = "none";

    try {
        const response = await fetch("/api/voiceover", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                script: script,
                gender: selectedGender,
                language: language,
                style: style
            })
        });

        if (!response.ok) {
            let message = "ऑडियो नहीं बन पाया।";

            try {
                const errorData = await response.json();
                message = errorData.detail || message;
            } catch (error) {}

            throw new Error(message);
        }

        const audioBlob = await response.blob();

        if (!audioBlob.size) {
            throw new Error("खाली ऑडियो मिला। दोबारा कोशिश करें।");
        }

        if (currentAudioUrl) {
            URL.revokeObjectURL(currentAudioUrl);
        }

        currentAudioUrl = URL.createObjectURL(audioBlob);

        audioPlayer.src = currentAudioUrl;
        audioPlayer.style.display = "block";

        downloadLink.href = currentAudioUrl;
        downloadLink.style.display = "block";

        statusBox.textContent =
            "आपका पूरा Voiceover तैयार है! अब सुनें या MP3 डाउनलोड करें।";

    } catch (error) {
        statusBox.textContent =
            "समस्या: " + error.message +
            " अगर स्क्रिप्ट बहुत लंबी है, तो सर्वर की समय सीमा भी कारण हो सकती है।";

    } finally {
        generateBtn.disabled = countWords(scriptInput.value) > MAX_WORDS;
        generateBtn.textContent = "Generate Voice";
    }
}

generateBtn.addEventListener("click", generateVoice);

updateCounter();
</script>

</body>
</html>
